[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenguard"
version = "0.1.0"
description = "API spend guardrails: per-key / per-project monthly budgets, usage ingestion, threshold alerts, and a hard-stop enforcement hook."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
tokenguard = "tokenguard.cli:main"

[tool.setuptools.packages.find]
include = ["tokenguard*"]
